name: Build the mod
description: Set up xmake and LLVM, build the mod into bin/, and optionally run the offline tests. Windows runners only.

inputs:
  cache:
    description: Restore and save the xmake package cache.
    default: "true"
  tests:
    description: Also build and run the offline tests.
    default: "false"

runs:
  using: composite
  steps:
    - uses: xmake-io/github-action-setup-xmake@v1

    - if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/AppData/Local/.xmake
        key: xmake-${{ hashFiles('xmake.lua') }}
        restore-keys: |
          xmake-

    - name: Setup LLVM
      uses: ZhongRuoyu/setup-llvm@v0
      with:
        llvm-version: 22

    - shell: pwsh
      run: |
        xmake repo -u

    - shell: pwsh
      run: |
        xmake f -a x64 -m release -p windows --target_type=server -y

    - name: Build the mod
      shell: pwsh
      run: |
        xmake -w -y

    # device-auth-test is left out: it calls Xbox Live over the network.
    - name: STUN test
      if: inputs.tests == 'true'
      shell: pwsh
      run: |
        xmake build -y stun-test
        xmake run stun-test

    - name: UDP ports test
      if: inputs.tests == 'true'
      shell: pwsh
      run: |
        xmake build -y udp-ports-test
        xmake run udp-ports-test

    - name: Signal text test
      if: inputs.tests == 'true'
      shell: pwsh
      run: |
        xmake build -y signal-text-test
        xmake run signal-text-test
