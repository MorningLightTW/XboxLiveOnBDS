name: CI

on:
  push:
    branches:
      - main
    paths: &code
      - "src/**"
      - "src-server/**"
      - "src-client/**"
      - "tests/**"
      - "xmake.lua"
      - "manifest.json"
      - ".clang-format"
      - ".github/workflows/ci.yml"
      - ".github/actions/**"
  pull_request:
    paths: *code
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the run still going. Pushes to main each get their own group, so every
# commit there keeps its result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Pinned to the clang-format the code is formatted with (LLVM 23.1.2); another version may format differently.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: clang-format check
        run: |
          git ls-files -z 'src/*.cpp' 'src/*.h' 'src-server/*.cpp' 'src-server/*.h' 'tests/*.cpp' \
            | xargs -0 pipx run clang-format==23.1.2 --style=file --dry-run --Werror

  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/build
        with:
          tests: true

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-server-windows-x64
          path: |
            bin/
          retention-days: 14
