name: Release

# Actions > Release > Run workflow, or: gh workflow run release.yml -f version=0.2.0
# Write the notes under "## [Unreleased]" in CHANGELOG.md first. The run sets the version in xmake.lua, lip.toml
# and CHANGELOG.md, builds, and only if the build passes commits that to main, tags v<version> and publishes the
# release with the mod zip and its SHA-256.
#
# The release commit is pushed with the workflow's own token, so it starts no CI run of its own: this run has
# already built and tested that exact tree. The push also needs main to accept direct pushes from Actions; with
# a rule that demands pull requests, give the workflow a bypass (or a token that has one).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (no leading v)"
        required: true
        type: string
      dry_run:
        description: "Build and zip only: no commit, tag or release (the zip is kept as a run artifact)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  # Not ZIP: zip(1) reads its default options from $ZIP.
  ZIP_NAME: ${{ github.event.repository.name }}-server-windows-x64.zip

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set the version
        id: version
        shell: bash
        run: |
          # publish commits on top of exactly what was built; its push fails if main has moved on since.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi
          bash scripts/bump-version.sh "$VERSION"

      # No package cache: what gets published is built from fresh downloads, not from what an earlier run left.
      - uses: ./.github/actions/build
        with:
          cache: false
          tests: true

      - uses: actions/upload-artifact@v7
        with:
          name: bin
          path: |
            bin/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # For the attestation.
      id-token: write
      attestations: write
    steps:
      # Keeps the token: this job pushes the release commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Set the version
        run: |
          bash scripts/bump-version.sh "$VERSION"
          # This version's section of the changelog, for the release page.
          bash scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v8
        with:
          name: bin
          path: artifact

      - name: Zip
        run: |
          cp CHANGELOG.md LICENSE README.md artifact/
          (cd artifact && zip -r "$RUNNER_TEMP/$ZIP_NAME" .)
          unzip -l "$RUNNER_TEMP/$ZIP_NAME"
          (cd "$RUNNER_TEMP" && sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256")

      - name: Keep the zip (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ runner.temp }}/${{ env.ZIP_NAME }}

      # Signed proof that this run built the zip: gh attestation verify <zip> -R <owner>/<repo>.
      # Attestations are not offered for a private repository on this plan. Before the push, so that a failure
      # here leaves nothing behind.
      - name: Attest the zip
        if: ${{ !inputs.dry_run && !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/${{ env.ZIP_NAME }}

      - name: Commit, tag and publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "The files already say v$VERSION; tagging the built commit."
          else
            git commit -am "build: release v$VERSION"
            git push origin HEAD:main
          fi
          gh release create "v$VERSION" "$RUNNER_TEMP/$ZIP_NAME" "$RUNNER_TEMP/$ZIP_NAME.sha256" \
            --target "$(git rev-parse HEAD)" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
