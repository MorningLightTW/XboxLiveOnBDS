name: CodeQL (workflows)

# Scans every workflow and the local actions, so it runs only when they change; C++ has its own workflow
# (codeql-cpp.yml). Code scanning is free for public repositories only, so the job is skipped while the
# repository is private.
on:
  push:
    branches:
      - main
    paths: &workflows
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths: *workflows
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    # Workflows are not built, so no Windows runner is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions
