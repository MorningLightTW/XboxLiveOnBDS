name: Docker

# Runs the mod in LeviLamina's Docker images (ghcr.io/liteldev/levilamina-server): a Linux container (BDS under
# Wine) and a Windows container. Passes when the mod loads, reaches Microsoft over WinHTTP (the sign-in code is
# shown) and the server starts. Nobody signs in, so Xbox Live's WebSockets and friends' joins are not covered.
#
#   gh workflow run docker.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build

      - uses: actions/upload-artifact@v7
        with:
          name: mod
          path: |
            bin/

  run:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wine
            runs-on: ubuntu-latest
            image: ghcr.io/liteldev/levilamina-server:latest-wine
            data: /data
          # The image is built on Windows Server 2022: its runner can run it with process isolation.
          - name: windows
            runs-on: windows-2022
            image: ghcr.io/liteldev/levilamina-server:latest-windows
            data: C:\data
    name: run (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: mod
          path: bin

      - name: Start the server
        run: |
          version=$(sed -nE 's/^local levilamina_version = "([^"]+)".*/\1/p' xmake.lua)
          mkdir -p data/mods
          cp -r bin/xbox-live-on-bds data/mods/
          src="$PWD/data"
          opts=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            src=$(cygpath -w "$src")
          else
            # The image runs Wine as root, and Wine refuses a prefix in a directory root does not own.
            sudo chown -R 0:0 data
            # Docker's default seccomp profile blocks a call wineserver makes ("wine: socket : Function not
            # implemented"), so Wine cannot start at all.
            opts+=(--security-opt seccomp=unconfined)
          fi
          docker pull "${{ matrix.image }}"
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            # The image's entrypoint installs .NET with "winetricks dotnet10", whose x86 installer fails under Wine
            # (status 2), so lip (a .NET program) cannot install BDS. Set up the prefix the way the entrypoint does,
            # but unpack the x64 .NET runtime (the one lip needs) instead; the entrypoint skips both steps then.
            docker run --rm "${opts[@]}" -v "$src:${{ matrix.data }}" --entrypoint sh "${{ matrix.image }}" -c '
              set -e
              mkdir -p /data/.tmp
              wineboot --init
              # Its x86 installer can fail under Wine (status 130); the entrypoint goes on regardless, so do we.
              xvfb-run -a winetricks -q vcrun2026 || echo "winetricks vcrun2026 failed ($?); going on like the image"
              wget -qO /tmp/dotnet.zip \
                https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.5/dotnet-runtime-10.0.5-win-x64.zip
              mkdir -p "/data/.wine/drive_c/Program Files/dotnet"
              unzip -q /tmp/dotnet.zip -d "/data/.wine/drive_c/Program Files/dotnet"
              wineserver -w
            ' 2>&1 | { grep -v -E "fixme:|^[[:space:]]*$" || true; } | tail -n 40
          fi
          docker run -d -i --name bds "${opts[@]}" -e EULA=TRUE -e VERSION="$version" \
            -v "$src:${{ matrix.data }}" "${{ matrix.image }}"
          # Written as it comes (the sign-in code redacted: it is not meant for a public log), so the log is there
          # even when the run is cancelled or times out. Keeps running into the later steps.
          nohup sh -c "docker logs -f bds 2>&1 | sed -u -E 's/(enter the code )[A-Za-z0-9-]+/\1<redacted>/' > server.log" \
            > /dev/null 2>&1 &

      - name: Wait for the mod and the server
        run: |
          result=timeout
          for i in $(seq 1 240); do
            if ! docker ps -q --filter name=bds | grep -q .; then result=exited; break; fi
            if grep -q "Could not start the Microsoft account sign-in" server.log; then result=no-https; break; fi
            if grep -q -E "refusing to create a configuration directory|wine: socket : Function not implemented" \
              server.log; then result=no-wine; break; fi
            if grep -q "You must install .NET" server.log; then result=no-dotnet; break; fi
            if grep -q "Sign in the Xbox account" server.log && grep -q "Server started" server.log; then
              result=ok; break
            fi
            # Progress, visible while the step runs: how far the log is, and its last line with text in it.
            if (( i % 6 == 0 )); then
              # grep finds nothing while the log has no text yet: that must not end the step (bash -e, pipefail).
              last=$(grep -v -E "fixme:|^[[:space:]]*$" server.log | tail -n 1 | tr -d '\r' | cut -c1-200 || true)
              echo "[$((i / 6)) min] $(wc -l < server.log) lines | $last"
            fi
            sleep 10
          done
          echo "::group::Server log"; cat server.log; echo "::endgroup::"
          echo "result: $result"
          case "$result" in
            ok) echo "The mod loaded, reached Microsoft over HTTPS and the server started" ;;
            no-https) echo "::error::The mod could not reach Microsoft over HTTPS (WinHTTP)"; exit 1 ;;
            no-wine) echo "::error::Wine could not start"; exit 1 ;;
            no-dotnet) echo "::error::No .NET in the Wine prefix, so lip could not install the server"; exit 1 ;;
            *)
              grep -q "xbox-live-on-bds loaded" server.log || { echo "::error::The mod did not load ($result)"; exit 1; }
              echo "::error::The mod loaded, but no sign-in code and started server ($result)"; exit 1 ;;
          esac

      - name: Stop the server
        if: always()
        run: docker rm -f bds || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-log-${{ matrix.name }}
          path: server.log
          if-no-files-found: ignore
