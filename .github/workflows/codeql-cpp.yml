name: CodeQL (C++)

# Runs only when the C++ or how it is built changes; workflows have their own scan (codeql-actions.yml).
# Code scanning is free for public repositories only, so the job is skipped while the repository is private.
on:
  push:
    branches:
      - main
    paths: &code
      - "src/**"
      - "tests/**"
      - "xmake.lua"
      # They decide how the C++ is compiled for the analysis.
      - ".github/actions/build/**"
      - ".github/workflows/codeql-cpp.yml"
  pull_request:
    paths: *code
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    # C++ is analyzed from a real build: CodeQL watches the compiler, so it sees LeviLamina's hook macros
    # expanded and the BDS types resolved. Without a build (build-mode none) it took each hook macro for an
    # unused variable and missed the reads inside the hooks.
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # xmake does its part before init. Once CodeQL traces the job, xmake can no longer start other programs
      # (git: "packages(git): must be installed"; clang-cl: "The data area passed to a system call is too small"),
      # so it only sets the build up and writes down the compile commands.
      - uses: ./.github/actions/build
        with:
          build: false

      - name: Write the compile commands
        shell: pwsh
        run: |
          xmake project -k compile_commands
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $commands = Get-Content compile_commands.json -Raw | ConvertFrom-Json
          "$($commands.Count) compile command(s):"
          $commands.file

      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      # Between init and analyze, so that the compiler runs are traced: each compile command is run as xmake
      # would run it, without xmake. Nothing is linked; CodeQL only needs the compiler to see every source file.
      - name: Compile every source file
        shell: pwsh
        run: |
          $failed = Get-Content compile_commands.json -Raw | ConvertFrom-Json | ForEach-Object -Parallel {
            $arguments = @($_.arguments)
            # The folders of the object file (-Fo) and the PDB (-Fd): xmake makes them when it builds.
            foreach ($argument in $arguments) {
              if ($argument -match '^[-/]F[od](.+)$') {
                New-Item -ItemType Directory -Force (Split-Path $Matches[1]) | Out-Null
              }
            }
            $output = & $arguments[0] $arguments[1..($arguments.Count - 1)] 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::group::$($_.file) failed"
              $output | Select-Object -Last 40 | Out-String | Write-Host
              Write-Host "::endgroup::"
              $_.file
            }
          } -ThrottleLimit 4
          if ($failed) {
            Write-Host "::error::$(@($failed).Count) source file(s) did not compile"
            exit 1
          }

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
