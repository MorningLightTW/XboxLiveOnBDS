name: CodeQL

# Code scanning is free for public repositories only, so the job is skipped while the repository is private.
on:
  push:
    branches:
      - main
    paths: &code
      - "src/**"
      - "tests/**"
      - "xmake.lua"
      # The actions language scans every workflow and the local actions.
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths: *code
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # C++ is analyzed from a real build: CodeQL watches the compiler, so it sees LeviLamina's hook macros
          # expanded and the BDS types resolved. Without a build (build-mode none) it took each hook macro for
          # an unused variable and missed the reads inside the hooks.
          - language: c-cpp
            build-mode: manual
            runs-on: windows-latest
          # Workflows are not built, so no Windows runner is needed.
          - language: actions
            build-mode: none
            runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Tools, packages and configuration come before init: once CodeQL traces the job, xmake no longer finds
      # git ("packages(git): must be installed") and cannot update its repositories.
      - if: matrix.build-mode == 'manual'
        uses: ./.github/actions/build
        with:
          build: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # Between init and analyze, so that the compiler runs are traced. The tests are built too (not run): they
      # are scanned like the mod.
      - name: Build the mod and the tests
        if: matrix.build-mode == 'manual'
        shell: pwsh
        run: |
          xmake -w -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in "stun-test", "udp-ports-test", "signal-text-test") {
            xmake build -y $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
