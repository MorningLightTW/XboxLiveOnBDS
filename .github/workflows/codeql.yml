name: CodeQL

# Code scanning is free for public repositories only, so the job is skipped while the repository is private.
on:
  push:
    branches:
      - main
    paths: &code
      - "src/**"
      - "src-server/**"
      - "src-client/**"
      - "tests/**"
      # The actions language scans every workflow and the local actions.
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths: *code
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    # Nothing is built (build-mode none), so no Windows runner is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode none: no xmake build (and no LeviLamina download) needed; the hooks into BDS headers
          # are analyzed less precisely, the network and auth code fully.
          - language: c-cpp
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
